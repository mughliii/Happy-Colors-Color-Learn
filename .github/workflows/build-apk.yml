name: Build Happy Colors Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies & build offline bundle
        run: |
          npm install
          npm run build:android
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/
          rm -f android/app/src/main/assets/www/*.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Upload Happy Colors APK
        uses: actions/upload-artifact@v4
        with:
          name: HappyColors-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
